name: Build SiddOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install gnu-efi toolchain
        run: sudo apt-get update && sudo apt-get install -y gnu-efi build-essential

      - name: Build
        run: make

      - name: Upload main.efi
        uses: actions/upload-artifact@v4
        with:
          name: siddos-efi
          path: main.efi
